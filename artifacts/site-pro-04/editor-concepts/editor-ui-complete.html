</style></head><body><div id="app"></div><script>
const n=Number(new URLSearchParams(location.search).get('c')||1);
const name=['SITE DOCK','SCENE RIBBON','ORBIT COMMAND','CONTEXT STACK','BUILDER BELT'][n-1];
const theme=['','purple','coral','sage','sand'][n-1];
function frame(open,contents){return `<section class="screen ${theme}"><div class="scene"></div><div class="ui"><div class="state-tag">CONCEPT 0${n} · ${open?'MENU OPEN · TEMPORARY':'WORKSPACE · MENU CLOSED'}</div><div class="topbar"><div><div class="brand">SITE PRO 04 · LEVEL EDITOR</div><div class="title">${name}</div></div><div class="top-actions"><div class="toggle"><span>2D</span><span class="on">3D</span></div><span style="font-size:20px">×</span></div></div><div class="selection"><i class="dot"></i> GROUND · WALL 08 SELECTED</div><div class="floor">▤ FLOOR <strong>G-0 ▾</strong></div><div class="mark"><i></i></div>${contents}</div></section>`}
const nav=(active)=>`<div class="bottom">${[['⌖','SCENE'],['＋','BUILD'],['✥','EDIT'],['◫','GROUPS'],['▣','SAVE']].map(([i,t])=>`<div class="navitem ${active===t?'active':''}"><b>${i}</b>${t}</div>`).join('')}</div>`;
let closed='',opened='';
if(n===1){closed=`<div class="hint">Tap wall to edit · 2 fingers pan / zoom</div>${nav('SCENE')}`;opened=`<div class="shelf"><div class="shelf-head">ADD TO THIS FLOOR <span>⌄ CLOSE</span></div><div class="grid"><div class="tile active"><b>▥</b>BRICK WALL</div><div class="tile"><b>▤</b>CONCRETE</div><div class="tile"><b>▱</b>FLOOR</div><div class="tile"><b>▰</b>STAIRS</div></div><div class="meta"><span>Drag into the live scene</span><strong>⌑ SNAP 25 cm ON</strong></div></div>${nav('BUILD')}`;}

if(n===4){closed=`<div class="hint">Selected wall · tap card for dimensions</div><div class="bottom"><div class="navitem"><b>＋</b>ADD</div><div class="navitem"><b>◫</b>OBJECTS</div><div class="navitem active"><b>✥</b>EDIT</div><div class="navitem"><b>▣</b>SAVE</div></div>`;opened=`<div class="accordion"><h3>WALL 08 · QUICK EDIT <span>⌄ CLOSE</span></h3><div class="fields"><div class="field"><small>POSITION X</small><strong>11.50 m</strong></div><div class="field"><small>LENGTH</small><strong>3.20 m</strong></div><div class="field"><small>ANGLE</small><strong>90°</strong></div><div class="field"><small>HEIGHT</small><strong>3.00 m</strong></div></div><div class="actions"><div class="action on">↔ MOVE</div><div class="action">◴ ROTATE</div><div class="action">⇱ SIZE</div></div></div><div class="bottom"><div class="navitem"><b>＋</b>ADD</div><div class="navitem"><b>◫</b>OBJECTS</div><div class="navitem active"><b>✥</b>EDIT</div><div class="navitem"><b>▣</b>SAVE</div></div>`;}

</script></body></html>
