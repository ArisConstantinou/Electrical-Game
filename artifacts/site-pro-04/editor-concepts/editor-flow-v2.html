</style></head><body><div id="app"></div><script>
const n=Number(new URLSearchParams(location.search).get('c')||1),names=['Dock Nest','Asset Track','Orbit Wheel','Context Cards','Dual Thumb'];
const nav=(active)=>{
  if(n===2)return `<div class="side-rail">${[['▤','VIEW'],['＋','BUILD'],['✥','EDIT'],['◫','SCENE'],['▣','SAVE']].map(([i,t])=>`<div class="side-tab ${active===t?'active':''}"><b>${i}</b>${t}</div>`).join('')}</div>`;
  if(n===3)return `<div class="quick"><span>⌖ SELECT</span><span>▤ VIEW</span><span>▣ SAVE</span></div><div class="hub">◎</div>`;
  if(n===4)return `<div class="context-pods"><span class="primary">＋ BUILD</span><span>▤ VIEW</span><span>◫ SCENE</span><span>▣ SAVE</span></div>`;
  if(n===5)return `<div class="dock">${[['⌖','SELECT'],['＋','BUILD'],['✥','EDIT']].map(([i,t])=>`<div class="tab ${active===t?'active':''}"><b>${i}</b>${t}</div>`).join('')}</div><div class="side"><span>▤ VIEW</span><span>▣ SAVE</span></div>`;
  return `<div class="dock">${[['▤','VIEW'],['＋','BUILD'],['✥','EDIT'],['◫','SCENE'],['▣','SAVE']].map(([i,t])=>`<div class="tab ${active===t?'active':''}"><b>${i}</b>${t}</div>`).join('')}</div>`;
};
const shell=(state,contents)=>`<div class="caption">0${n} ${names[n-1].toUpperCase()} · ${state.toUpperCase()}</div><section class="screen c${n}"><div class="${state==='View / floor'?'topworld':'world'}"></div><div class="shade"></div><div class="ui">${contents}</div></section>`;
const assets=`<div class="asset-sheet"><div class="sheet-title">▧ BUILD ASSETS <small>⌄ CLOSE</small></div><div class="categories"><div class="category active">▤ STRUCTURE</div><div class="category">ϟ ELECTRICAL</div><div class="category">⚒ EQUIPMENT</div><div class="category">⌖ STARTS</div></div><div class="asset-grid"><div class="asset active"><i class="thumb brick"></i><strong>BRICK WALL</strong></div><div class="asset"><i class="thumb concrete"></i><strong>CONCRETE WALL</strong></div><div class="asset"><i class="thumb slab"></i><strong>FLOOR SLAB</strong></div><div class="asset"><i class="thumb stair"></i><strong>STAIRS</strong></div></div><div class="sheet-foot"><span>Tap an asset, then place it in 3D</span><strong>⌑ SNAP 25 cm</strong></div></div>`;
const orbit=`<div class="mark"></div><div class="badge">BRICK WALL 08</div><div class="orbit-tether"></div><div class="orbit"></div>`;
const edit=`${orbit}<div class="mode-chip">◉ SELECTED · 3.20 m · snap on</div><div class="edit-sheet"><div class="edit-tool active"><b>↔</b>MOVE</div><div class="edit-tool"><b>◴</b>ROTATE</div><div class="edit-tool"><b>⇱</b>SIZE</div><div class="edit-tool"><b>◫</b>GROUP</div></div>${nav('EDIT')}`;
const placing=`<div class="placement-tag">BRICK WALL · PREVIEW</div><div class="ghost"></div><div class="footer-action"><div>↶ CANCEL</div><div>◴ ROTATE 90°</div><div class="primary">✓ PLACE</div></div>${nav('BUILD')}`;
const view=`<div class="view-badge">LIVE TOP VIEW · ONLY G-0 VISIBLE</div><div class="view-sheet"><div class="sheet-title">▤ VIEW & FLOOR <small>⌄ CLOSE</small></div><div class="view-modes"><div class="active">▦ 2D · TOP</div><div>◈ 3D · WALK</div></div><div class="floor-strip">${['B2','B1','G-0','L1','L2','L3','L4'].map(f=>`<div class="floor-tile ${f==='G-0'?'active':''}">${f}</div>`).join('')}</div><div class="floor-note">One editable floor. All other floors hidden.</div></div>${nav('VIEW')}`;
let workspace=`<div class="arc-handle">⌃</div>`;
let build=`${assets}${nav('BUILD')}`;
let placement=placing;
let selected=edit;
let floors=view;
let open=shell('Dock open',nav('BUILD'));
if(n===2){workspace=`<div class="edge-handle">›</div>`;open=shell('Slide rail open',nav('BUILD'));}
if(n===3){workspace=nav('SELECT');open='';}
if(n===4){workspace=`<div class="context-launch">＋<br>BUILD</div>`;open='';}
if(n===5){workspace=`<div class="thumb-launch left">＋ BUILD</div><div class="thumb-launch right">▤ VIEW</div>`;open=shell('Belt open',nav('BUILD'));}
const wheel=`<div class="wheel"><i>◎</i><span class="w1">＋ BUILD</span><span class="w2">✥ EDIT</span><span class="w3">◫ GROUP</span><span class="w4">▤ VIEW</span><span class="w5">▣ SAVE</span></div>${nav('SELECT')}`;
document.querySelector('#app').innerHTML=shell('Clean canvas',workspace)+open+(n===3?shell('Command wheel',wheel):'')+shell('Build assets',build)+shell('Place brick wall',placement)+shell('Edit / Orbit Halo',selected)+shell('View / floor',floors);
</script></body></html>
