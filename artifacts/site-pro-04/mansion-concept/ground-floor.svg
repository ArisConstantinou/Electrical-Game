  <text x="70" y="1125" fill="#172529" font-family="Arial,sans-serif" font-size="26" font-weight="700">ΚΑΤΑΣΚΕΥΑΣΤΙΚΗ ΛΟΓΙΚΗ</text>
  <text x="70" y="1170" fill="#526062" font-family="Arial,sans-serif" font-size="23">Το σημερινό δωμάτιο δεν μετακινείται. Ανοιχτό πέρασμα → διάδρομος → κλιμακοστάσιο.</text>
  <text x="70" y="1210" fill="#526062" font-family="Arial,sans-serif" font-size="23">Πήλινη τοιχοποιία, σκυρόδεμα, βαθιές σκιάσεις, ανοιχτή αυλή — όλα υπό κατασκευή.</text>
  <text x="70" y="1250" fill="#526062" font-family="Arial,sans-serif" font-size="23">Οι χώροι είναι ζώνες παιχνιδιού· ανοίγματα/φέροντα στοιχεία χρειάζονται 3D έλεγχο.</text>
  <text x="70" y="1336" fill="#a45238" font-family="Arial,sans-serif" font-size="21" font-weight="700">CONCEPT ΓΙΑ ΕΓΚΡΙΣΗ · ΟΧΙ SCREENSHOT ΤΟΥ ΠΑΙΧΝΙΔΙΟΥ</text>
