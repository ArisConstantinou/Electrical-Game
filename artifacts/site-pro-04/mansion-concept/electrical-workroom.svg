<text x="92" y="1073" font-family="Arial,sans-serif" font-size="22" fill="#17323b">Το σχέδιο ακολουθεί INSTALLATION_POINTS του παιχνιδιού και ενημερώνεται από την πρόοδο.</text>
<text x="92" y="1111" font-family="Arial,sans-serif" font-size="22" fill="#17323b">Δεν καθορίζονται ακόμη πίνακας, παροχή, προστασίες ή τελική συνδεσμολογία.</text>
<text x="92" y="1150" font-family="Arial,sans-serif" font-size="22" fill="#17323b">Πριν πραγματική εγκατάσταση απαιτείται μελέτη αδειούχου ηλεκτρολόγου και ισχύοντες κανόνες.</text>
<text x="62" y="1278" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#a34c34">ΣΧΕΔΙΟ ΠΑΙΧΝΙΔΙΟΥ · ΜΕΤΡΗΜΕΝΕΣ ΘΕΣΕΙΣ, ΟΧΙ ΣΧΕΔΙΟ ΚΑΤΑΣΚΕΥΗΣ</text>
